<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Zugzwang" />
		<meta
			name="description"
			content="Kostenloser Schach-Trainer: Spielen, Puzzles, Eröffnungen und Endspiele – offline auf iPhone, iPad und Mac."
		/>
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
