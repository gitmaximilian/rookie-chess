<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Rookie" />
		<meta
			name="description"
			content="Free chess trainer: play, puzzles, openings and endgames – offline on iPhone, iPad and Mac."
		/>
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<script>
			try {
				var t = localStorage.getItem('rookie:theme');
				if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
				var l = localStorage.getItem('rookie:lang');
				if (l === 'de' || l === 'en') document.documentElement.lang = l;
				var b = JSON.parse(localStorage.getItem('rookie:board') || '{}');
				if (b.theme) document.documentElement.setAttribute('data-board', b.theme);
				if (b.pieces) document.documentElement.setAttribute('data-pieces', b.pieces);
				// Erststart: App verdecken, bis klar ist, ob das Onboarding kommt (kein Aufblitzen)
				if (localStorage.getItem('rookie:onboarded') !== '1')
					document.documentElement.setAttribute('data-first-run', '');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
